name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Verificação de Tipos (Typecheck)
        run: npm run typecheck

      - name: Testes Unitários (Vitest)
        run: npm test

      - name: Compilação de Produção (Build)
        run: npm run build
        env:
          DATABASE_URL: 'file:./dev.db'
          AUTH_SECRET: 'ci-temporary-secret-key-for-build'
          NEXT_PUBLIC_SITE_URL: 'https://portfolio-mjc.vercel.app'
