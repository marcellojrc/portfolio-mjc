name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: 'file:./dev.db'
      AUTH_SECRET: 'ci-temporary-secret-key-for-build'
      NEXT_PUBLIC_SITE_URL: 'https://portfolio-mjc.vercel.app'

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Preparar Base de Dados CI
        run: npx prisma db push

      - name: Verificação de Tipos
        run: npm run typecheck

      - name: Testes Unitários
        run: npm test

      - name: Compilação de Produção
        run: npm run build